{
  "version": 1,
  "title": "할 일을 등록하고 완료 결과 확인",
  "description": "사용자가 해야 할 일을 기록한 뒤 완료 처리하고, 다시 조회해 변경이 저장됐는지 확인한다.",
  "spec": "packages/api/openapi.contract.json",
  "steps": [
    {
      "id": "create_task",
      "title": "할 일 등록",
      "description": "사용자가 기억해야 할 작업을 입력해 자신의 할 일로 등록한다.",
      "expected": "입력한 작업이 새 ID와 미완료 상태로 저장된다.",
      "operationId": "createTask",
      "input": {
        "body": {
          "title": "발표 자료 준비"
        }
      },
      "expect": {
        "status": 201,
        "body": {
          "/completed": false
        }
      }
    },
    {
      "id": "complete_task",
      "title": "할 일 완료 처리",
      "description": "사용자가 앞서 등록한 작업을 끝내고 해당 할 일을 완료로 표시한다.",
      "expected": "등록 응답에서 받은 같은 ID의 완료 상태가 true가 된다.",
      "operationId": "updateTask",
      "input": {
        "path": {
          "id": {
            "from": "create_task",
            "pointer": "/id"
          }
        },
        "body": {
          "completed": true
        }
      },
      "expect": {
        "status": 200,
        "body": {
          "/completed": true
        }
      }
    },
    {
      "id": "read_task",
      "title": "저장된 완료 결과 확인",
      "description": "사용자가 작업을 다시 열어 완료 처리가 실제로 저장됐는지 확인한다.",
      "expected": "같은 할 일의 제목과 완료 상태가 다시 조회해도 유지된다.",
      "operationId": "getTask",
      "input": {
        "path": {
          "id": {
            "from": "create_task",
            "pointer": "/id"
          }
        }
      },
      "expect": {
        "status": 200,
        "body": {
          "/title": "발표 자료 준비",
          "/completed": true
        }
      }
    }
  ]
}
